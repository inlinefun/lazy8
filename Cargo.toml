[workspace]
members = ["common", "core", "ui"]
resolver = "3"

[workspace.dependencies]
lazy8-common = { path = "./common" }
lazy8-core = { path = "./core" }

clap = { version = "4.6.6", features = ["derive"] }
log = { version = "0.4.33" }
fern = { version = "0.7.1", features = ["colored", "chrono"] }
chrono = { version = "0.4.45", features = ["now"] }
winit = { version = "0.30.13", features = ["wayland"] }
pixels = { version = "0.17.2" }
